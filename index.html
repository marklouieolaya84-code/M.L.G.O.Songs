<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M.L.G.O</title>
<meta name="description" content="Local music player with folder connect and true no-repeat shuffle">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
:root{--bg:#0d0d0d;--line:#777;--ink:#bdbdbd;--navy:#2b3345;--hand:"Segoe Print","Bradley Hand","Comic Sans MS","Marker Felt",cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--hand)}
body{padding-top:env(titlebar-area-height,env(safe-area-inset-top,0px))}
button{font:inherit;color:inherit;background:none;border:3px solid var(--line);border-radius:22px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:8px;font-size:1.1rem;letter-spacing:.08em}
.brand img{width:34px;height:34px}
#connect{padding:8px 16px;border-radius:6px;font-size:1.05rem}
#star{width:46px;height:46px;border-radius:50%;font-size:1.4rem;line-height:1}
#star.on{color:#ffd34d;border-color:#ffd34d}
main{padding:8px 18px 190px;overflow-y:auto;height:calc(100% - 72px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}
.tile{aspect-ratio:1/1;border-radius:34px;padding:14px;text-align:left;font-size:1.35rem;display:flex;flex-direction:column;justify-content:space-between}
.tile .heart{font-size:3.4rem;line-height:1;margin:6px 0 0 18px}
.tile small{font-size:.85rem;opacity:.7}
h2{margin:6px 0 12px;font-weight:400}
.song{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin:0 0 10px;border-radius:16px;text-align:left}
.song.now{border-color:#fff;color:#fff}
.song span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song i{font-style:normal;padding:0 6px}
#q{width:100%;padding:12px 16px;margin-bottom:14px;background:none;color:inherit;font:inherit;border:3px solid var(--line);border-radius:22px}
.empty{opacity:.7;line-height:1.6;padding:20px 4px}
#mini{position:fixed;left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));height:68px;border:3px solid var(--line);border-radius:34px;background:var(--bg);display:flex;align-items:center;gap:12px;padding:0 16px 0 12px}
#art{width:44px;height:44px;border-radius:8px;padding:0;flex:none}
#art img{width:100%;height:100%;border-radius:5px}
#title{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:1rem}
#mini .c{width:44px;height:44px;border:0;font-size:1.5rem;padding:0}
nav{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));height:78px;border:3px solid var(--line);border-radius:40px;background:var(--bg);display:flex;justify-content:space-around;align-items:center}
nav button{border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.9rem;padding:6px 14px;border-radius:14px}
nav button b{font-size:1.5rem;font-weight:400;line-height:1}
nav button[aria-current=true]{color:#fff}
@media(min-width:700px){body{max-width:560px;margin:0 auto}#mini,nav{left:50%;right:auto;width:540px;transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/icons/icon-192.png" alt="">M.L.G.O</div>
  <button id="connect">Connect file</button>
  <button id="star" aria-label="Like current song" aria-pressed="false">☆</button>
</header>
<main id="main"></main>
<div id="mini">
  <button id="art" aria-label="Play or pause"><img src="/icons/icon-192.png" alt=""></button>
  <div id="title">Nothing playing</div>
  <button class="c" id="pp" aria-label="Play or pause">▷</button>
  <button class="c" id="next" aria-label="Next song">▷|</button>
</div>
<nav>
  <button data-v="home"><b>⌂</b>Home</button>
  <button data-v="search"><b>⌕</b>Search</button>
  <button data-v="library"><b>▤</b>Library</button>
</nav>
<input id="files" type="file" accept="audio/*" multiple hidden>
<audio id="au"></audio>
<script>
const $=s=>document.querySelector(s),au=$('#au'),main=$('#main');
let songs=[],bag=[],hist=[],cur=-1,view='home',query='';
let liked=new Set();try{liked=new Set(JSON.parse(localStorage.getItem('mlgo-liked')||'[]'))}catch(e){}
const saveLiked=()=>{try{localStorage.setItem('mlgo-liked',JSON.stringify([...liked]))}catch(e){}};
const AUD=/\.(mp3|m4a|wav|ogg|flac|aac|opus|weba)$/i;
const clean=n=>n.replace(/\.[^.]+$/,'');
function addFiles(list){
  const have=new Set(songs.map(s=>s.key));
  for(const f of list){const key=f.name+'|'+f.size;if(have.has(key)||!(f.type.startsWith('audio/')||AUD.test(f.name)))continue;
    songs.push({key,name:clean(f.name),file:f});have.add(key)}
  songs.sort((a,b)=>a.name.localeCompare(b.name));bag=[];cur=songs.findIndex(s=>s.url&&s.playing);render()}
async function walk(dir,out){for await(const [n,h] of dir.entries()){
  if(h.kind==='file'){if(AUD.test(n))out.push(await h.getFile())}else await walk(h,out)}}
$('#connect').onclick=async()=>{
  if(window.showDirectoryPicker){try{const d=await showDirectoryPicker({mode:'read'}),out=[];await walk(d,out);addFiles(out);return}catch(e){if(e.name==='AbortError')return}}
  $('#files').click()};
$('#files').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
// true no-repeat shuffle: every song plays once before any song repeats
function refill(){bag=songs.map((_,i)=>i);
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
  if(bag.length>1&&bag[bag.length-1]===cur){[bag[bag.length-1],bag[0]]=[bag[0],bag[bag.length-1]]}}
function play(i,fromUser){
  if(!songs[i])return;if(cur>=0&&cur!==i)hist.push(cur);
  const k=bag.indexOf(i);if(k>-1)bag.splice(k,1);
  if(songs[cur]?.url){URL.revokeObjectURL(songs[cur].url);songs[cur].url=null}
  cur=i;const s=songs[i];s.url=URL.createObjectURL(s.file);au.src=s.url;au.play().catch(()=>{});
  $('#title').textContent=s.name;
  if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'M.L.G.O',artwork:[{src:'/icons/icon-512.png',sizes:'512x512',type:'image/png'}]})}
  sync();render()}
function next(){if(!songs.length)return;if(!bag.length)refill();play(bag.pop())}
function prev(){const p=hist.pop();if(p!==undefined){const c=cur;cur=-1;play(p);if(c>=0&&!bag.includes(c)){}}}
au.onended=next;au.onplay=au.onpause=sync;
function sync(){$('#pp').textContent=au.paused?'▷':'❚❚';
  const on=cur>=0&&liked.has(songs[cur].key);$('#star').textContent=on?'★':'☆';$('#star').classList.toggle('on',on);$('#star').setAttribute('aria-pressed',on)}
const toggle=()=>{if(cur<0){next();return}au.paused?au.play():au.pause()};
$('#pp').onclick=$('#art').onclick=toggle;$('#next').onclick=next;
$('#star').onclick=()=>{if(cur<0)return;const k=songs[cur].key;liked.has(k)?liked.delete(k):liked.add(k);saveLiked();sync();render()};
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('nexttrack',next);m.setActionHandler('previoustrack',prev)}
function row(i){const s=songs[i];return `<button class="song ${i===cur?'now':''}" data-i="${i}"><span>${esc(s.name)}</span><i data-h="${i}" role="button" aria-label="Like">${liked.has(s.key)?'♥':'♡'}</i></button>`}
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function list(title,idx,msg){return `<h2>${title}</h2>`+(idx.length?idx.map(row).join(''):`<p class="empty">${msg}</p>`)}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===(view==='liked'||view==='songs'?'library':view)));
  const all=songs.map((_,i)=>i),lk=all.filter(i=>liked.has(songs[i].key));let h='';
  if(view==='home'){h=`<div class="tiles"><button class="tile" data-go="liked"><span class="heart">♡</span><span>Likesongs<br><small>${lk.length} songs</small></span></button><button class="tile" data-go="songs"><span>Songlist<br><small>${songs.length} songs</small></span></button></div>`+(songs.length?'':'<p class="empty">Tap “Connect file” to pick your music folder. Songs play in true no-repeat shuffle.</p>')}
  else if(view==='liked')h=list('Likesongs',lk,'No liked songs yet. Tap the star while a song plays.');
  else if(view==='search'){const q=query.toLowerCase();h=`<input id="q" type="search" placeholder="Search songs" value="${esc(query)}" aria-label="Search songs">`+(q?list('Results',all.filter(i=>songs[i].name.toLowerCase().includes(q)),'No songs match.'):'<p class="empty">Type to search your connected songs.</p>')}
  else h=list(view==='songs'?'Songlist':'Library',all,'No songs yet. Tap “Connect file”.');
  main.innerHTML=h;const q=$('#q');if(q){q.oninput=e=>{query=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}}
main.onclick=e=>{const h=e.target.closest('[data-h]');
  if(h){e.stopPropagation();const k=songs[+h.dataset.h].key;liked.has(k)?liked.delete(k):liked.add(k);saveLiked();sync();render();return}
  const s=e.target.closest('.song');if(s)return play(+s.dataset.i,true);
  const g=e.target.closest('[data-go]');if(g){view=g.dataset.go;render()}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
// launched from a file, shortcut, or share
const p=new URLSearchParams(location.search);if(['liked','songs','search'].includes(p.get('view')))view=p.get('view');
if(p.get('text')||p.get('title')){view='search';query=p.get('title')||p.get('text')||''}
if('launchQueue'in window)launchQueue.setConsumer(async l=>{const f=[];for(const h of l.files)f.push(await h.getFile());if(f.length){addFiles(f);play(songs.findIndex(s=>s.file===f[0]))}});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
render();sync();
</script>
</body>
</html>
